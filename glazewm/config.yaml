general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#3f3f42'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#1f2220'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1-desktop'
    display_name: 'desktop'
    keep_alive: true
  - name: '2-chrome'
    display_name: 'chrome'
  - name: '3-terminal'
    display_name: 'terminal'
  - name: '4-spotify'
    display_name: 'spotify'
  - name: '5-discord'
    display_name: 'discord'
  - name: '6-telegram'
    display_name: 'telegram'
  - name: '7-eve'
    display_name: 'eve'
  - name: '8-obsidian'
    display_name: 'obsidian'
  - name: '9-claude'
    display_name: 'claude'
  - name: '10-games'
    display_name: 'games'
  - name: '11-misc'
    display_name: 'misc'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { regex: '(?i)^(zebar)$' }
      - window_class: { equals: 'AutoHotkeyGUI' }
      - window_process: { regex: '(?i)^(snippingtool|screenclippinghost|screensketch|textinputhost|shellexperiencehost|searchhost|searchapp|startmenuexperiencehost|lockapp|peopleexperiencehost|windows\.internal\.shellcommon\.accountscontrol)$' }
      - window_class: { regex: '(?i)^(Windows\.UI\.Core\.CoreWindow|Shell_TrayWnd|Shell_SecondaryTrayWnd|WorkerW|Progman)$' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

  - commands: ['set-tiling', 'move --workspace 3-terminal', 'focus --workspace 3-terminal']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^windowsterminal$' }
  - commands: ['move --workspace 2-chrome', 'focus --workspace 2-chrome']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^chrome$' }
  - commands: ['move --workspace 8-obsidian', 'focus --workspace 8-obsidian']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^obsidian$' }
  - commands: ['move --workspace 6-telegram', 'focus --workspace 6-telegram']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^telegram$' }
  - commands: ['move --workspace 5-discord', 'focus --workspace 5-discord']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^discord$' }
  - commands: ['move --workspace 4-spotify', 'focus --workspace 4-spotify']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^spotify$' }
  - commands: ['set-tiling']
    on: ['manage', 'focus']
    run_once: false
    match:
      - window_process: { regex: '(?i)^spotify$' }
  - commands: ['move --workspace 9-claude', 'focus --workspace 9-claude']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^claude$' }
  - commands: ['move --workspace 10-games', 'focus --workspace 10-games']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(battle|battlenet|blizzardbrowser|blizzarderror|diablo|eaconnect_microsoft|eadesktop|ealauncher|epicgameslauncher|epicwebhelper|eve-o preview|eve-online|evelauncher|fortniteclient-win64-shipping|fortnitelauncher|gameoverlayui64|hearthstone|hearthstone beta launcher|hearthstonedecktracker|hellfire|heroes of the storm|heroesofthestorm_x64|heroesswitcher_x64|idlemasterextended|launcher|leagueclient|leagueclientux|leagueclientuxrender|link2ea|lion|lion-win64-shipping|lor|osu!|overwatch launcher|pokemon tcg live|riot client|riotclientservices|riotclientux|sheep|steam|steam-idle|steamerrorreporter|steamerrorreporter64|steamwebhelper|tekken-7-player-displayer|tera|tftclient|tftclient-win64-shipping|tormentum ii|ubisoftconnect|ubisoftgamelauncher|ubisoftgamelauncher64|unrealenginelauncher|upc|uplaywebcore|valorant|valorant-win64-shipping|warcraft iii|warcraft iii launcher|world editor)$' }
  - commands: ['move --workspace 7-eve', 'focus --workspace 7-eve']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^exefile$' }

  - commands: ['move --workspace 11-misc', 'focus --workspace 11-misc']
    on: ['manage']
    match:
      - window_process: { not_regex: '(?i)^(windowsterminal|chrome|obsidian|telegram|discord|spotify|claude|battle|battlenet|blizzardbrowser|blizzarderror|diablo|eaconnect_microsoft|eadesktop|ealauncher|epicgameslauncher|epicwebhelper|eve-o preview|eve-online|evelauncher|fortniteclient-win64-shipping|fortnitelauncher|gameoverlayui64|hearthstone|hearthstone beta launcher|hearthstonedecktracker|hellfire|heroes of the storm|heroesofthestorm_x64|heroesswitcher_x64|idlemasterextended|launcher|leagueclient|leagueclientux|leagueclientuxrender|link2ea|lion|lion-win64-shipping|lor|osu!|overwatch launcher|pokemon tcg live|riot client|riotclientservices|riotclientux|sheep|steam|steam-idle|steamerrorreporter|steamerrorreporter64|steamwebhelper|tekken-7-player-displayer|tera|tftclient|tftclient-win64-shipping|tormentum ii|ubisoftconnect|ubisoftgamelauncher|ubisoftgamelauncher64|unrealenginelauncher|upc|uplaywebcore|valorant|valorant-win64-shipping|warcraft iii|warcraft iii launcher|world editor|exefile|zebar|snippingtool|screenclippinghost|screensketch|textinputhost|shellexperiencehost|searchhost|searchapp|startmenuexperiencehost|lockapp)$' }

binding_modes:
  - name: 'resize'
    keep_alive: true
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'lwin+r']

keybindings:
  - commands: ['focus --workspace 1-desktop']
    bindings: ['ctrl+shift+0']
  - commands: ['focus --workspace 3-terminal']
    bindings: ['ctrl+shift+t']
  - commands: ['focus --workspace 2-chrome']
    bindings: ['ctrl+shift+g']
  - commands: ['focus --workspace 8-obsidian']
    bindings: ['ctrl+shift+o']
  - commands: ['focus --workspace 5-discord']
    bindings: ['ctrl+shift+d']
  - commands: ['focus --workspace 6-telegram']
    bindings: ['ctrl+shift+m']
  - commands: ['focus --workspace 9-claude']
    bindings: ['ctrl+shift+c']
  - commands: ['focus --workspace 10-games']
    bindings: ['ctrl+shift+p']
  - commands: ['focus --workspace 7-eve']
    bindings: ['ctrl+shift+e']
  - commands: ['focus --workspace 11-misc']
    bindings: ['ctrl+shift+9']
  - commands: ['focus --workspace 4-spotify']
    bindings: ['ctrl+shift+s']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+tab']

  - commands: ['move --workspace 1-desktop', 'focus --workspace 1-desktop']
    bindings: ['ctrl+shift+lwin+0']
  - commands: ['move --workspace 3-terminal', 'focus --workspace 3-terminal']
    bindings: ['ctrl+shift+lwin+t']
  - commands: ['move --workspace 2-chrome', 'focus --workspace 2-chrome']
    bindings: ['ctrl+shift+lwin+g']
  - commands: ['move --workspace 8-obsidian', 'focus --workspace 8-obsidian']
    bindings: ['ctrl+shift+lwin+o']
  - commands: ['move --workspace 5-discord', 'focus --workspace 5-discord']
    bindings: ['ctrl+shift+lwin+d']
  - commands: ['move --workspace 6-telegram', 'focus --workspace 6-telegram']
    bindings: ['ctrl+shift+lwin+m']
  - commands: ['move --workspace 9-claude', 'focus --workspace 9-claude']
    bindings: ['ctrl+shift+lwin+c']
  - commands: ['move --workspace 10-games', 'focus --workspace 10-games']
    bindings: ['ctrl+shift+lwin+p']
  - commands: ['move --workspace 7-eve', 'focus --workspace 7-eve']
    bindings: ['ctrl+shift+lwin+e']
  - commands: ['move --workspace 11-misc', 'focus --workspace 11-misc']
    bindings: ['ctrl+shift+lwin+9']
  - commands: ['move --workspace 4-spotify', 'focus --workspace 4-spotify']
    bindings: ['ctrl+shift+lwin+s']

  - commands: ['wm-cycle-focus']
    bindings: ['lwin+shift+l']
  - commands: ['focus --direction left']
    bindings: ['lwin+alt+h']
  - commands: ['focus --direction right']
    bindings: ['lwin+alt+l']
  - commands: ['focus --direction up']
    bindings: ['lwin+alt+k']
  - commands: ['focus --direction down']
    bindings: ['lwin+alt+j']

  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']

  - commands: ['shell-exec wscript.exe C:\Users\Alex\.glzr\glazewm\kill-workspace.vbs']
    bindings: ['lwin+q']
  - commands: ['close']
    bindings: ['lwin+shift+q']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+a']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+shift+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+v']
  - commands: ['toggle-tiling']
    bindings: ['lwin+shift+v']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r']

  - commands: ['shell-exec wt']
    bindings: ['lwin+enter']

  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+r']
  - commands: ['wm-redraw']
    bindings: ['lwin+shift+w']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+e']
