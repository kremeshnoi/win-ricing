general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#3f3f42'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#1f2220'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1-desktop'
    display_name: 'desktop'
    keep_alive: true
  - name: '2-system'
    display_name: 'system'
  - name: '3-terminal'
    display_name: 'terminal'
  - name: '4-chrome'
    display_name: 'chrome'
  - name: '5-claude'
    display_name: 'claude'
  - name: '6-obsidian'
    display_name: 'obsidian'
  - name: '7-docker'
    display_name: 'docker'
  - name: '8-tabularis'
    display_name: 'tabularis'
  - name: '9-spotify'
    display_name: 'spotify'
  - name: '10-discord'
    display_name: 'discord'
  - name: '11-telegram'
    display_name: 'telegram'
  - name: '12-eve'
    display_name: 'eve'
  - name: '13-games'
    display_name: 'games'
  - name: '14-misc'
    display_name: 'misc'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { regex: '(?i)^(zebar)$' }
      - window_class: { equals: 'AutoHotkeyGUI' }
      - window_process: { regex: '(?i)^(snippingtool|screenclippinghost|screensketch|textinputhost|shellexperiencehost|searchhost|searchapp|startmenuexperiencehost|lockapp|peopleexperiencehost|windows\.internal\.shellcommon\.accountscontrol)$' }
      - window_class: { regex: '(?i)^(Windows\.UI\.Core\.CoreWindow|Shell_TrayWnd|Shell_SecondaryTrayWnd|WorkerW|Progman)$' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

  - commands: ['set-tiling', 'move --workspace 3-terminal', 'focus --workspace 3-terminal']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^windowsterminal$' }
  - commands: ['move --workspace 4-chrome', 'focus --workspace 4-chrome']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^chrome$' }
  - commands: ['move --workspace 6-obsidian', 'focus --workspace 6-obsidian']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^obsidian$' }
  - commands: ['move --workspace 11-telegram', 'focus --workspace 11-telegram']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^telegram$' }
  - commands: ['move --workspace 10-discord', 'focus --workspace 10-discord']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^discord$' }
  - commands: ['move --workspace 9-spotify', 'focus --workspace 9-spotify']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^spotify$' }
  - commands: ['set-tiling']
    on: ['manage', 'focus']
    run_once: false
    match:
      - window_process: { regex: '(?i)^spotify$' }
  - commands: ['move --workspace 5-claude', 'focus --workspace 5-claude']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^claude$' }
  - commands: ['move --workspace 13-games', 'focus --workspace 13-games']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(battle|battlenet|blizzardbrowser|blizzarderror|diablo|eaconnect_microsoft|eadesktop|ealauncher|epicgameslauncher|epicwebhelper|eve-o preview|eve-online|evelauncher|fortniteclient-win64-shipping|fortnitelauncher|gameoverlayui64|hearthstone|hearthstone beta launcher|hearthstonedecktracker|hellfire|heroes of the storm|heroesofthestorm_x64|heroesswitcher_x64|idlemasterextended|launcher|leagueclient|leagueclientux|leagueclientuxrender|link2ea|lion|lion-win64-shipping|lor|osu!|overwatch launcher|pokemon tcg live|riot client|riotclientservices|riotclientux|sheep|steam|steam-idle|steamerrorreporter|steamerrorreporter64|steamwebhelper|tekken-7-player-displayer|tera|tftclient|tftclient-win64-shipping|tormentum ii|ubisoftconnect|ubisoftgamelauncher|ubisoftgamelauncher64|unrealenginelauncher|upc|uplaywebcore|valorant|valorant-win64-shipping|warcraft iii|warcraft iii launcher|world editor)$' }
  - commands: ['move --workspace 12-eve', 'focus --workspace 12-eve']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^exefile$' }

  - commands: ['move --workspace 2-system', 'focus --workspace 2-system']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(systemsettings|taskmgr|mmc|regedit|resmon|msinfo32)$' }
  - commands: ['move --workspace 7-docker', 'focus --workspace 7-docker']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^docker desktop$' }
  - commands: ['move --workspace 8-tabularis', 'focus --workspace 8-tabularis']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^tabularis$' }

  - commands: ['move --workspace 14-misc', 'focus --workspace 14-misc']
    on: ['manage']
    match:
      - window_process: { not_regex: '(?i)^(windowsterminal|systemsettings|taskmgr|mmc|regedit|resmon|msinfo32|docker desktop|tabularis|chrome|obsidian|telegram|discord|spotify|claude|battle|battlenet|blizzardbrowser|blizzarderror|diablo|eaconnect_microsoft|eadesktop|ealauncher|epicgameslauncher|epicwebhelper|eve-o preview|eve-online|evelauncher|fortniteclient-win64-shipping|fortnitelauncher|gameoverlayui64|hearthstone|hearthstone beta launcher|hearthstonedecktracker|hellfire|heroes of the storm|heroesofthestorm_x64|heroesswitcher_x64|idlemasterextended|launcher|leagueclient|leagueclientux|leagueclientuxrender|link2ea|lion|lion-win64-shipping|lor|osu!|overwatch launcher|pokemon tcg live|riot client|riotclientservices|riotclientux|sheep|steam|steam-idle|steamerrorreporter|steamerrorreporter64|steamwebhelper|tekken-7-player-displayer|tera|tftclient|tftclient-win64-shipping|tormentum ii|ubisoftconnect|ubisoftgamelauncher|ubisoftgamelauncher64|unrealenginelauncher|upc|uplaywebcore|valorant|valorant-win64-shipping|warcraft iii|warcraft iii launcher|world editor|exefile|zebar|snippingtool|screenclippinghost|screensketch|textinputhost|shellexperiencehost|searchhost|searchapp|startmenuexperiencehost|lockapp)$' }

binding_modes:
  - name: 'resize'
    keep_alive: true
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['ctrl+alt+left']
      - commands: ['resize --width +2%']
        bindings: ['ctrl+alt+right']
      - commands: ['resize --height +2%']
        bindings: ['ctrl+alt+up']
      - commands: ['resize --height -2%']
        bindings: ['ctrl+alt+down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape']

keybindings:
  - commands: ['focus --workspace 1-desktop']
    bindings: ['ctrl+shift+0']
  - commands: ['focus --workspace 2-system']
    bindings: ['ctrl+shift+y']
  - commands: ['focus --workspace 3-terminal']
    bindings: ['ctrl+shift+t']
  - commands: ['focus --workspace 4-chrome']
    bindings: ['ctrl+shift+b']
  - commands: ['focus --workspace 5-claude']
    bindings: ['ctrl+shift+a']
  - commands: ['focus --workspace 6-obsidian']
    bindings: ['ctrl+shift+n']
  - commands: ['focus --workspace 7-docker']
    bindings: ['ctrl+shift+c']
  - commands: ['focus --workspace 8-tabularis']
    bindings: ['ctrl+shift+d']
  - commands: ['focus --workspace 9-spotify']
    bindings: ['ctrl+shift+s']
  - commands: ['focus --workspace 10-discord']
    bindings: ['ctrl+shift+x']
  - commands: ['focus --workspace 11-telegram']
    bindings: ['ctrl+shift+m']
  - commands: ['focus --workspace 12-eve']
    bindings: ['ctrl+shift+e']
  - commands: ['focus --workspace 13-games']
    bindings: ['ctrl+shift+g']
  - commands: ['focus --workspace 14-misc']
    bindings: ['ctrl+shift+9']
  - commands: ['focus --prev-active-workspace']
    bindings: ['ctrl+shift+h']

  - commands: ['move --workspace 1-desktop', 'focus --workspace 1-desktop']
    bindings: ['ctrl+alt+shift+0']
  - commands: ['move --workspace 2-system', 'focus --workspace 2-system']
    bindings: ['ctrl+alt+shift+y']
  - commands: ['move --workspace 3-terminal', 'focus --workspace 3-terminal']
    bindings: ['ctrl+alt+shift+t']
  - commands: ['move --workspace 4-chrome', 'focus --workspace 4-chrome']
    bindings: ['ctrl+alt+shift+b']
  - commands: ['move --workspace 5-claude', 'focus --workspace 5-claude']
    bindings: ['ctrl+alt+shift+a']
  - commands: ['move --workspace 6-obsidian', 'focus --workspace 6-obsidian']
    bindings: ['ctrl+alt+shift+n']
  - commands: ['move --workspace 7-docker', 'focus --workspace 7-docker']
    bindings: ['ctrl+alt+shift+c']
  - commands: ['move --workspace 8-tabularis', 'focus --workspace 8-tabularis']
    bindings: ['ctrl+alt+shift+d']
  - commands: ['move --workspace 9-spotify', 'focus --workspace 9-spotify']
    bindings: ['ctrl+alt+shift+s']
  - commands: ['move --workspace 10-discord', 'focus --workspace 10-discord']
    bindings: ['ctrl+alt+shift+x']
  - commands: ['move --workspace 11-telegram', 'focus --workspace 11-telegram']
    bindings: ['ctrl+alt+shift+m']
  - commands: ['move --workspace 12-eve', 'focus --workspace 12-eve']
    bindings: ['ctrl+alt+shift+e']
  - commands: ['move --workspace 13-games', 'focus --workspace 13-games']
    bindings: ['ctrl+alt+shift+g']
  - commands: ['move --workspace 14-misc', 'focus --workspace 14-misc']
    bindings: ['ctrl+alt+shift+9']

  - commands: ['focus --next-active-workspace']
    bindings: ['ctrl+shift+l']
  - commands: ['wm-cycle-focus']
    bindings: ['ctrl+alt+n']
  - commands: ['focus --direction left']
    bindings: ['ctrl+alt+h']
  - commands: ['focus --direction right']
    bindings: ['ctrl+alt+l']
  - commands: ['focus --direction up']
    bindings: ['ctrl+alt+k']
  - commands: ['focus --direction down']
    bindings: ['ctrl+alt+j']

  - commands: ['move --direction left']
    bindings: ['ctrl+alt+shift+h']
  - commands: ['move --direction right']
    bindings: ['ctrl+alt+shift+l']
  - commands: ['move --direction up']
    bindings: ['ctrl+alt+shift+k']
  - commands: ['move --direction down']
    bindings: ['ctrl+alt+shift+j']

  - commands: ['shell-exec wscript.exe C:\Users\Alex\.glzr\glazewm\kill-workspace.vbs']
    bindings: ['ctrl+shift+q']
  - commands: ['close']
    bindings: ['ctrl+alt+q']
  - commands: ['toggle-fullscreen']
    bindings: ['ctrl+alt+a']
  - commands: ['toggle-floating --centered']
    bindings: ['ctrl+alt+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['ctrl+alt+v']
  - commands: ['toggle-tiling']
    bindings: ['ctrl+alt+shift+v']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['ctrl+alt+r']

  - commands: ['shell-exec wt']
    bindings: ['ctrl+enter']

  - commands: ['wm-reload-config']
    bindings: ['ctrl+alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['ctrl+alt+w']
  - commands: ['wm-toggle-pause']
    bindings: ['ctrl+alt+p']
  - commands: ['wm-exit']
    bindings: ['ctrl+alt+e']
