general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: false
      color: '#8dbcff'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#a1a1a1'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1-desktop'
    display_name: 'desktop'
    keep_alive: true
  - name: '2-chrome'
    display_name: 'chrome'
    keep_alive: true
  - name: '3-terminal'
    display_name: 'terminal'
    keep_alive: true
  - name: '4-spotify'
    display_name: 'spotify'
    keep_alive: true
  - name: '5-discord'
    display_name: 'discord'
    keep_alive: true
  - name: '6-telegram'
    display_name: 'telegram'
    keep_alive: true
  - name: '7-claude'
    display_name: 'claude'
    keep_alive: true
  - name: '8-obsidian'
    display_name: 'obsidian'
    keep_alive: true
  - name: '9-misc'
    display_name: 'misc'
    keep_alive: true

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { regex: '(?i)^(zebar)$' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

  - commands: ['move --workspace 3-terminal', 'focus --workspace 3-terminal']
    match:
      - window_process: { regex: '(?i)^windowsterminal$' }
  - commands: ['move --workspace 2-chrome', 'focus --workspace 2-chrome']
    match:
      - window_process: { regex: '(?i)^chrome$' }
  - commands: ['move --workspace 7-claude', 'focus --workspace 7-claude']
    match:
      - window_process: { regex: '(?i)^claude$' }
  - commands: ['move --workspace 8-obsidian', 'focus --workspace 8-obsidian']
    match:
      - window_process: { regex: '(?i)^obsidian$' }
  - commands: ['move --workspace 6-telegram', 'focus --workspace 6-telegram']
    match:
      - window_process: { regex: '(?i)^telegram$' }
  - commands: ['move --workspace 5-discord', 'focus --workspace 5-discord']
    match:
      - window_process: { regex: '(?i)^discord$' }
  - commands: ['move --workspace 4-spotify', 'focus --workspace 4-spotify']
    match:
      - window_process: { regex: '(?i)^spotify$' }

  - commands: ['move --workspace 9-misc']
    match:
      - window_process: { not_regex: '(?i)^(windowsterminal|chrome|claude|obsidian|telegram|discord|spotify|zebar)$' }

binding_modes:
  - name: 'resize'
    keep_alive: true
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'lwin+r']

keybindings:
  - commands: ['focus --workspace 1-desktop']
    bindings: ['lwin+0']
  - commands: ['focus --workspace 3-terminal']
    bindings: ['lwin+t']
  - commands: ['focus --workspace 2-chrome']
    bindings: ['lwin+g']
  - commands: ['focus --workspace 7-claude']
    bindings: ['lwin+c']
  - commands: ['focus --workspace 8-obsidian']
    bindings: ['lwin+o']
  - commands: ['focus --workspace 5-discord']
    bindings: ['lwin+d']
  - commands: ['focus --workspace 6-telegram']
    bindings: ['lwin+m']
  - commands: ['focus --workspace 9-misc']
    bindings: ['lwin+9']
  - commands: ['focus --workspace 4-spotify']
    bindings: ['lwin+s']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+tab']

  - commands: ['move --workspace 1-desktop', 'focus --workspace 1-desktop']
    bindings: ['lwin+shift+0']
  - commands: ['move --workspace 3-terminal', 'focus --workspace 3-terminal']
    bindings: ['lwin+shift+t']
  - commands: ['move --workspace 2-chrome', 'focus --workspace 2-chrome']
    bindings: ['lwin+shift+g']
  - commands: ['move --workspace 7-claude', 'focus --workspace 7-claude']
    bindings: ['lwin+shift+c']
  - commands: ['move --workspace 8-obsidian', 'focus --workspace 8-obsidian']
    bindings: ['lwin+shift+o']
  - commands: ['move --workspace 5-discord', 'focus --workspace 5-discord']
    bindings: ['lwin+shift+d']
  - commands: ['move --workspace 6-telegram', 'focus --workspace 6-telegram']
    bindings: ['lwin+shift+m']
  - commands: ['move --workspace 9-misc', 'focus --workspace 9-misc']
    bindings: ['lwin+shift+9']
  - commands: ['move --workspace 4-spotify', 'focus --workspace 4-spotify']
    bindings: ['lwin+shift+s']

  - commands: ['wm-cycle-focus']
    bindings: ['lwin+shift+l']
  - commands: ['focus --direction left']
    bindings: ['lwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+down']

  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']

  - commands: ['close']
    bindings: ['lwin+q']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+a']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+shift+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+v']
  - commands: ['toggle-tiling']
    bindings: ['lwin+shift+v']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r']

  - commands: ['shell-exec wt']
    bindings: ['lwin+enter']

  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+r']
  - commands: ['wm-redraw']
    bindings: ['lwin+shift+w']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+e']
